<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>ACCORD Suisse — Logement, Emploi & Communauté · Permis S</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="icon" type="image/jpeg" href="/accord_logo.jpg"/>

  <link rel="stylesheet" href="/colors_and_type.css?v=2.7.1"/>
  <link rel="stylesheet" href="/kit-v2.css?v=2.7.1"/>
  <link rel="stylesheet" href="/styles.css?v=2.7.1"/>

  <style>
  :root {
    /* Base neutrals & surfaces */
    --bg-root: #070B12;
    --bg-1: #0B1220;
    --bg-2: #0F172A;
    --surface: rgba(15, 23, 42, 0.65);
    --surface-2: rgba(20, 30, 55, 0.55);
    --surface-elev: rgba(26, 37, 66, 0.72);
    --line: rgba(148, 163, 184, 0.15);
    --line-2: rgba(148, 163, 184, 0.22);
    --line-3: rgba(148, 163, 184, 0.32);

    /* Text */
    --fg: #F8FAFC;
    --fg-2: #E2E8F0;
    --fg-3: #CBD5E1;
    --muted: #94A3B8;
    --muted-2: #64748B;

    /* Brand accents */
    --swiss-red: #D52B1E;
    --swiss-red-2: #B71D12;
    --swiss-red-soft: rgba(213, 43, 30, 0.14);
    --swiss-red-glow: rgba(213, 43, 30, 0.35);

    --emerald: #10B981;
    --emerald-2: #059669;
    --emerald-soft: rgba(16, 185, 129, 0.12);
    --emerald-glow: rgba(16, 185, 129, 0.30);

    --sbb-blue: #38BDF8;
    --sbb-blue-2: #0EA5E9;
    --sbb-blue-soft: rgba(56, 189, 248, 0.10);

    --gold: #F59E0B;
    --gold-2: #D97706;
    --gold-soft: rgba(245, 158, 11, 0.10);

    --violet: #A78BFA;

    /* Ambient hero background */
    --bg-ambient:
      radial-gradient(1200px 620px at 82% -12%, rgba(213, 43, 30, 0.14), transparent 60%),
      radial-gradient(900px 520px at -8% 18%, rgba(16, 185, 129, 0.10), transparent 60%),
      radial-gradient(720px 500px at 50% 108%, rgba(245, 158, 11, 0.07), transparent 60%),
      var(--bg-root);

    /* Radii */
    --r-xs: 8px;
    --r-sm: 12px;
    --r-md: 14px;
    --r: 16px;
    --r-lg: 20px;
    --r-xl: 28px;
    --r-pill: 999px;

    /* Shadows */
    --sh-card: 0 20px 50px -20px rgba(0, 0, 0, 0.7);
    --sh-cta: 0 12px 30px -12px rgba(213, 43, 30, 0.55);
    --sh-cta-tg: 0 12px 30px -12px rgba(56, 189, 248, 0.55);
    --sh-cta-blue: 0 12px 30px -12px rgba(37, 99, 235, 0.55);

    --font-sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --ease: cubic-bezier(.4,0,.2,1);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg-ambient);
    background-attachment: fixed;
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }
  ::selection { background: var(--swiss-red); color: white; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  .container {
    max-width: 1220px;
    margin: 0 auto;
    padding: 0 28px;
  }
  @media (max-width: 640px) {
    .container { padding: 0 18px; }
  }

  /* ========== TOP BANNER ========== */
  .top-banner {
    background: linear-gradient(90deg, rgba(213,43,30,.10), rgba(16,185,129,.10));
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--fg-3);
  }
  .top-banner-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 24px;
    text-align: center;
    flex-wrap: wrap;
  }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 0 0 rgba(16,185,129,.55);
    animation: pulse 2.2s var(--ease) infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); }
    70% { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  /* ========== NAV ========== */
  .nav {
    position: sticky; top: 0; z-index: 60;
    background: rgba(7, 11, 18, 0.72);
    backdrop-filter: saturate(140%) blur(14px);
    -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .nav-row {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 28px;
    max-width: 1220px;
    margin: 0 auto;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .brand-mark {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(160deg, #E63946, var(--swiss-red-2));
    display: grid; place-items: center;
    box-shadow: 0 6px 20px -6px var(--swiss-red-glow), inset 0 0 0 1px rgba(255,255,255,.10);
    position: relative;
    overflow: hidden;
  }
  .brand-mark::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(80px 40px at 30% 20%, rgba(255,255,255,.20), transparent 70%);
    pointer-events: none;
  }
  .brand-text {
    display: flex; flex-direction: column; line-height: 1.05;
  }
  .brand-name {
    font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
    display: flex; align-items: baseline; gap: 6px;
  }
  .brand-name em {
    color: var(--emerald);
    font-style: normal; font-weight: 700; font-size: 13px;
    font-family: var(--font-mono); letter-spacing: 0;
  }
  .brand-tag {
    font-family: var(--font-mono);
    font-size: 10px; color: var(--muted); letter-spacing: 0.14em;
    text-transform: uppercase; margin-top: 2px;
  }
  .nav-mid {
    flex: 1;
    display: flex; justify-content: center;
  }
  .nav-links {
    display: flex; gap: 4px;
    padding: 4px;
    background: rgba(15,23,42,.55);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
  }
  .nav-link {
    padding: 7px 14px;
    font-size: 13px; font-weight: 500;
    color: var(--fg-3);
    border-radius: var(--r-pill);
    transition: color .15s var(--ease), background .15s var(--ease);
  }
  .nav-link:hover { color: var(--fg); background: rgba(255,255,255,.04); }
  .nav-actions { display: flex; align-items: center; gap: 10px; }

  .lang-toggle {
    display: flex; gap: 2px;
    padding: 3px;
    background: rgba(15,23,42,.55);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
  }
  .lang-btn {
    background: transparent; border: 0;
    padding: 5px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    font-family: var(--font-mono);
    color: var(--muted); cursor: pointer;
    border-radius: var(--r-pill);
    transition: all .15s var(--ease);
    display: flex; align-items: center; gap: 4px;
  }
  .lang-btn:hover { color: var(--fg-2); }
  .lang-btn.active {
    background: var(--fg);
    color: var(--bg-root);
  }

  /* ========== BUTTONS ========== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 18px;
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.005em;
    border-radius: var(--r-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: transform .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
    white-space: nowrap;
    text-decoration: none;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: linear-gradient(180deg, #E5352C, var(--swiss-red));
    color: white;
    box-shadow: var(--sh-cta), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .btn-primary:hover { box-shadow: 0 16px 34px -10px rgba(213,43,30,.75); }
  .btn-tg {
    background: linear-gradient(180deg, #38BDF8, #0284C7);
    color: white;
    box-shadow: var(--sh-cta-tg), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .btn-tg:hover { box-shadow: 0 16px 34px -10px rgba(56,189,248,.75); }
  .btn-blue {
    background: linear-gradient(180deg, #3B82F6, #2563EB);
    color: white;
    box-shadow: var(--sh-cta-blue), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .btn-ghost {
    background: rgba(255,255,255,.04);
    border-color: var(--line-2);
    color: var(--fg-2);
  }
  .btn-ghost:hover { background: rgba(255,255,255,.08); border-color: var(--line-3); }
  .btn-lg { padding: 14px 24px; font-size: 15px; border-radius: var(--r); }
  .btn-emerald {
    background: linear-gradient(180deg, #10B981, #059669);
    color: white;
    box-shadow: 0 12px 30px -12px rgba(16,185,129,.55), inset 0 1px 0 rgba(255,255,255,.18);
  }

  /* ========== HERO ========== */
  .hero {
    padding: 72px 0 44px;
    position: relative;
  }
  .hero-pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 6px 14px;
    background: rgba(16,185,129,.08);
    border: 1px solid rgba(16,185,129,.25);
    border-radius: var(--r-pill);
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 600; letter-spacing: 0.14em;
    color: #6EE7B7;
    text-transform: uppercase;
  }
  .hero-title {
    font-size: clamp(38px, 5.5vw, 68px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.02;
    margin: 22px 0 22px;
    text-wrap: balance;
    max-width: 960px;
  }
  .hero-accent {
    background: linear-gradient(90deg, #F87171, var(--gold), var(--emerald));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  .hero-sub {
    font-size: 18.5px;
    color: var(--fg-3);
    max-width: 720px;
    line-height: 1.55;
    margin: 0 0 32px;
    text-wrap: pretty;
  }
  .hero-cta-row {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .hero-reassure {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 12px; color: var(--muted);
    padding: 6px 12px;
    border-radius: var(--r-pill);
    background: rgba(255,255,255,.02);
    border: 1px solid var(--line);
    margin-bottom: 44px;
    flex-wrap: wrap;
  }
  .hero-reassure .check {
    color: var(--emerald); font-weight: 700;
  }
  .hero-reassure .sep { color: var(--muted-2); }

  /* Tabs Bénéficiaire / Bénévole */
  .side-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    max-width: 780px;
    margin-bottom: 40px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .side-tab {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 14px 16px;
    background: transparent;
    border: 0;
    border-radius: var(--r);
    color: var(--fg-3);
    text-align: left;
    cursor: pointer;
    transition: all .18s var(--ease);
    position: relative;
  }
  .side-tab:hover { background: rgba(255,255,255,.03); color: var(--fg); }
  .side-tab.active {
    background: rgba(15,23,42,.85);
    color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--line-2), 0 8px 24px -12px rgba(0,0,0,.6);
  }
  .side-tab-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .side-tab.active.side-a .side-tab-icon { background: var(--swiss-red-soft); color: #F87171; }
  .side-tab.active.side-b .side-tab-icon { background: rgba(56,189,248,.12); color: var(--sbb-blue); }
  .side-tab:not(.active) .side-tab-icon { background: rgba(255,255,255,.04); color: var(--muted); }
  .side-tab-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .side-tab-label { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .side-tab-sub { font-size: 12.5px; color: var(--muted); }
  .side-tab.active .side-tab-sub { color: var(--fg-3); }

  /* Trust grid */
  .trust-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    max-width: 900px;
  }
  .trust-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 16px 18px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }
  .trust-tile::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--emerald);
  }
  .trust-tile.rail-crimson::before { background: var(--swiss-red); }
  .trust-tile.rail-gold::before { background: var(--gold); }
  .trust-tile.rail-blue::before { background: var(--sbb-blue); }
  .trust-label {
    font-family: var(--font-mono);
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 8px;
  }
  .trust-value {
    font-family: var(--font-mono);
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    color: var(--fg);
    margin-bottom: 4px;
  }
  .trust-desc { font-size: 12.5px; color: var(--fg-3); line-height: 1.4; }

  /* ========== SECTION SHELL ========== */
  .section {
    padding: 80px 0;
    position: relative;
  }
  .section-alt { background: rgba(11, 18, 32, .35); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .section-head {
    max-width: 780px;
    margin-bottom: 44px;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--font-mono);
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: var(--r-pill);
    margin-bottom: 16px;
  }
  .eyebrow.crimson { color: #FCA5A5; background: var(--swiss-red-soft); border: 1px solid rgba(213,43,30,.28); }
  .eyebrow.emerald { color: #6EE7B7; background: var(--emerald-soft); border: 1px solid rgba(16,185,129,.28); }
  .eyebrow.blue { color: #93C5FD; background: rgba(59,130,246,.10); border: 1px solid rgba(59,130,246,.28); }
  .eyebrow.gold { color: #FCD34D; background: var(--gold-soft); border: 1px solid rgba(245,158,11,.28); }

  .section-title {
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 1.08;
    margin: 0 0 14px;
    text-wrap: balance;
  }
  .section-sub {
    font-size: 16.5px; color: var(--fg-3);
    max-width: 640px;
    text-wrap: pretty;
    margin: 0;
  }

  /* ========== PILLARS 2x2 ========== */
  .pillars {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  @media (max-width: 820px) {
    .pillars { grid-template-columns: 1fr; }
  }
  .pillar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 28px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
    transition: border-color .2s var(--ease), transform .2s var(--ease);
  }
  .pillar:hover { border-color: var(--line-3); transform: translateY(-2px); }
  .pillar-glow {
    position: absolute; inset: -1px -1px auto -1px; height: 80px;
    background: linear-gradient(180deg, currentColor, transparent);
    opacity: .08;
    pointer-events: none;
  }
  .pillar-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .pillar-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.05);
    border: 1px solid var(--line-2);
    flex-shrink: 0;
    font-size: 22px;
  }
  .pillar-index {
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
  }
  .pillar-title {
    font-size: 21px; font-weight: 700; letter-spacing: -0.015em;
    margin: 4px 0 12px;
    color: var(--fg);
  }
  .pillar-body {
    font-size: 14.5px; color: var(--fg-3);
    line-height: 1.6;
    margin: 0 0 18px;
  }
  .pillar-kpi {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-family: var(--font-mono);
    padding: 6px 12px;
    background: rgba(0,0,0,.25);
    border: 1px solid var(--line);
    border-radius: var(--r-xs);
  }
  .pillar-kpi-num {
    font-size: 15px; font-weight: 700;
    color: var(--fg);
  }
  .pillar-kpi-lbl {
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
  }
  .pillar-1 { color: var(--gold); }
  .pillar-2 { color: var(--sbb-blue); }
  .pillar-3 { color: var(--emerald); }
  .pillar-4 { color: var(--swiss-red); }

  /* ========== JOB CATALOGUE ========== */
  .jobs-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 14px;
    margin-bottom: 24px;
  }
  .filter-pills {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .filter-pill {
    padding: 6px 12px;
    font-size: 12.5px; font-weight: 500;
    color: var(--fg-3);
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    cursor: pointer;
    transition: all .15s var(--ease);
  }
  .filter-pill:hover { border-color: var(--line-3); color: var(--fg); }
  .filter-pill.active {
    background: var(--fg);
    color: var(--bg-root);
    border-color: var(--fg);
    font-weight: 600;
  }
  .jobs-count {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--sbb-blue);
    padding: 6px 12px;
    background: var(--sbb-blue-soft);
    border: 1px solid rgba(56,189,248,.25);
    border-radius: var(--r-xs);
  }

  .jobs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .job-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex; flex-direction: column; gap: 14px;
    transition: border-color .2s var(--ease), transform .2s var(--ease);
  }
  .job-card:hover { border-color: var(--line-3); transform: translateY(-2px); }
  .job-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
    padding: 4px 9px;
    border-radius: var(--r-pill);
    text-transform: uppercase;
    line-height: 1.2;
  }
  .badge-emerald { background: var(--emerald-soft); color: #6EE7B7; border: 1px solid rgba(16,185,129,.28); }
  .badge-gold { background: var(--gold-soft); color: #FCD34D; border: 1px solid rgba(245,158,11,.28); }
  .badge-red { background: var(--swiss-red-soft); color: #FCA5A5; border: 1px solid rgba(213,43,30,.28); }
  .badge-neutral { background: rgba(255,255,255,.04); color: var(--fg-3); border: 1px solid var(--line-2); }
  .badge-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .job-title {
    font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--fg);
    line-height: 1.3;
    margin: 0;
    text-wrap: balance;
  }
  .job-company {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--muted);
  }
  .company-logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: rgba(255,255,255,.06);
